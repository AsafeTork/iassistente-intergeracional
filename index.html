<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="IAssistente Intergeracional — protótipo: tutoria reversa que guia idosos e PcD passo a passo em portais como o Gov.br, com voz, fonte grande e alto contraste."
    />
    <meta name="theme-color" content="#0b3b5b" />
    <title>IAssistente Intergeracional — Protótipo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // VLibras plugin - inclusão de libras com segurança
      try {
        const script = document.createElement('script');
        script.src = 'https://vlibras.gov.br/app/vlibras-plugin.js';
        script.async = true;
        script.onload = () => { if (window.vLibras) window.vLibras.init(); };
        script.onerror = () => { /* plugin indisponível: segue sem quebras */ };
        document.body.appendChild(script);
      } catch {
        /* script tag failed: segue sem VLibras */
      }
    </script>
  </body>
</html>
